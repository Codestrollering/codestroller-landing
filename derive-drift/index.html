<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dérive &amp; Drift — interactive prototype</title>
<meta name="description" content="Interactive phone prototype of Dérive & Drift, a Paris wandering guide.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dongle:wght@300;400;700&family=Noto+Serif:wght@400;700&display=swap">
<style>
  html, body { margin: 0; height: 100%; background: #111; }
  body { display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #stage { width: 390px; height: 844px; transform-origin: center center; flex: none; }
  #phone { width: 390px; height: 844px; position: relative; overflow: hidden; background: #000; color: #f5f5f5;
    font-family: 'Dongle', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    font-weight: 700; line-height: 0.75; user-select: none; -webkit-user-select: none; border-radius: 40px;
    box-shadow: 0 0 0 1px #2a2a2a, 0 30px 80px rgba(0,0,0,0.7); }
  #phone button { all: unset; cursor: pointer; box-sizing: border-box; }
  #phone button:focus-visible { outline: 2px solid #fbbf24; outline-offset: 2px; }
  .serif { font-family: 'Noto Serif', Georgia, serif; line-height: 1.6; }
  .fr { opacity: 0.6; }
  .abs { position: absolute; }
  .fill { position: absolute; inset: 0; }
  #live.pulse { animation: buzz .25s ease-in-out 4; border-color: #fbbf24 !important; }
  @keyframes buzz { 0%,100% { translate: 0 0; } 25% { translate: -3px 0; } 75% { translate: 3px 0; } }
  .arrow { animation: sway 3s ease-in-out infinite; transform-origin: 60px 60px; }
  @keyframes sway { 0%,100% { translate: 0 0; } 50% { translate: 0 -6px; } }
  @media (max-width: 430px) { #phone { border-radius: 0; box-shadow: none; } body { background: #000; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="stage"><div id="phone" role="application" aria-label="Dérive & Drift prototype"></div></div>
<script>
const SPOTS = [
  { id: "dehillerin", name: "E. Dehillerin", tagEn: "Heavy Copper & Cutlery", tagFr: "Cuivre & Outillage", arr: "1er Arrondissement", address: "18 Rue Coquillière", dist: "110m", hoursEn: "09:00 – 19:00 · Open", hoursFr: "Ouvert", specFr: "Cuivre massif 2.5mm–3mm étamé au feu. Queue de fonte rivetée. Aucun prix affiché : relevé au crayon et consultation du grand registre papier.", specEn: "Solid 2.5–3mm hand-wiped tin copper. Riveted cast-iron handles. No price tags: cross-reference hand-punched codes in the central ledger.", detailsEn: "2.5mm solid copper · Ref. 44102 · Tax refund on site", detailsFr: "2.5mm Cuivre Massif · Réf. 44102 · Détaxe sur place" },
  { id: "chez-denise", name: "Chez Denise (La Tour de Montlhéry)", tagEn: "Historic All-Night Meat Counter", tagFr: "Bistrot de Nuit & Halles", arr: "1er Arrondissement", address: "5 Rue des Prouvaires", dist: "180m", hoursEn: "Open until 5:00 AM", hoursFr: "Ouvert jusqu’à 05:00", specFr: "Nappes à carreaux rouges, serveurs en longs tabliers, os à moelle brûlants, tripes au bouillon et Brouilly tiré au pot.", specEn: "Red checkered cloth, floor-length white aprons, roasted marrow bones, Caen-style tripe, and Beaujolais by the earthenware jug.", detailsEn: "4 Open counter seats", detailsFr: "4 Couverts libres au comptoir" },
  { id: "doursoux", name: "Doursoux Surplus Militaire", tagEn: "Authentic French Workwear Surplus", tagFr: "Toile & Bleu de Travail", arr: "15e Arrondissement", address: "3 Passage Alexandre", dist: "340m", hoursEn: "10:00 – 18:30 · Tue–Sat", hoursFr: "Mar–Sam", specFr: "Rayons d’acier brut sans mise en scène. Véritables vestes en moleskine et sergé de coton bleu 1950–1970 à prix d’atelier (30 €–65 €).", specEn: "Raw steel shelves without boutique markups. Authentic French moleskin and indigo cotton chore coats (30 €–65 €).", detailsEn: "30 € – 65 € · Period military stock", detailsFr: "Stocks militaires d’époque" },
  { id: "baron-rouge", name: "Le Baron Rouge", tagEn: "Curb Wine Cask & Fresh Oysters", tagFr: "Zinc & Huîtres au Tonneau", arr: "12e Arrondissement", address: "1 Rue Théophile Roussel", dist: "60m", hoursEn: "Open counter", hoursFr: "Comptoir libre", specFr: "Bourriche d’huîtres ouvertes sur le trottoir le matin. Vin tiré directement de la cuve dans des bouteilles consignées.", specEn: "Breton oysters shucked onto curb crates. Natural wine gravity-poured from oak barrels into refillable carafes.", detailsEn: "No booking · Barrel tasting", detailsFr: "Sans réservation · Dégustation sur tonneau" }
];
const EVENTS = [
  { id: "bach", time: "20:30 · 21 NOVEMBRE", titleFr: "Suites pour Violoncelle Seul (J.S. Bach)", titleEn: "Unaccompanied Cello Suites by Candlelight", venue: "Église Saint-Éphrem (Ve Arr.)", descFr: "Nef acoustique en pierre du XVIIe siècle. Éclairage exclusif à la bougie. 45 chaises de bois.", action: "HOLD 4 SEATS", done: "4 SEATS HELD" },
  { id: "vernissage", time: "18:00 · 23 NOVEMBRE", titleFr: "Vernissage : Typographie & Épreuves d’Artiste", titleEn: "Vernissage: Typography & Silver Proofs", venue: "Galerie d’Estampes (Rue Charlot, IIIe)", descFr: "Portes de la cour cochère grandes ouvertes. Tirages argentiques noir et blanc, vin servi au gobelet Duralex.", action: "ADD TO DRIFT", done: "ADDED TO DRIFT" }
];
const SCENES = {
  "dehillerin": "radial-gradient(circle at 30% 38%, #f6b26b 0 9%, #b45309 10% 17%, transparent 18%), radial-gradient(circle at 70% 30%, #fcd34d 0 6%, #c2410c 7% 13%, transparent 14%), radial-gradient(circle at 58% 64%, #fdba74 0 11%, #9a3412 12% 20%, transparent 21%), repeating-linear-gradient(90deg, #1c1917 0 46px, #292524 46px 50px), linear-gradient(#292524, #0c0a09)",
  "chez-denise": "radial-gradient(ellipse at 50% 30%, rgba(253,224,71,.35), transparent 55%), repeating-conic-gradient(#991b1b 0 25%, #f5f5f4 0 50%) 0 0/56px 56px",
  "doursoux": "repeating-linear-gradient(45deg, rgba(255,255,255,.06) 0 2px, transparent 2px 7px), repeating-linear-gradient(0deg, #3f3f46 0 6px, transparent 6px 150px), linear-gradient(160deg, #1e3a8a, #172554 55%, #44403c)",
  "baron-rouge": "radial-gradient(circle at 25% 55%, transparent 0 18%, #451a03 18.5% 20%, transparent 20.5% 30%, #451a03 30.5% 32%, transparent 32.5%), radial-gradient(circle at 75% 55%, transparent 0 18%, #451a03 18.5% 20%, transparent 20.5% 30%, #451a03 30.5% 32%, transparent 32.5%), linear-gradient(#7f1d1d, #3b0a0a 60%, #78716c)",
  "pluie": "radial-gradient(ellipse at 50% 0%, rgba(254,243,199,.45), transparent 50%), repeating-linear-gradient(90deg, rgba(0,0,0,.55) 0 3px, transparent 3px 60px), repeating-radial-gradient(ellipse at 50% -20%, transparent 0 40px, rgba(255,255,255,.08) 40px 42px), linear-gradient(#44403c, #1c1917 70%)",
  "oeil": "radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px) 0 0/6px 6px, linear-gradient(135deg, #1f2a24, #0f1512 60%, #3f2d1d)"
};



// Your own photos, per view. Falls back to the drawn scene if a file is missing.
const IMG = {
  "chez-denise": { walk: "img/denise-street.jpg", read: "img/denise-street.jpg", dossier: "img/denise-street.jpg", pos: { read: "center 45%", dossier: "center 42%" } },
  "baron-rouge": { walk: "img/baron-street.webp", read: "img/baron-barrels.webp", dossier: "img/baron-barrels.webp", pos: { walk: "50% center" } },
  "doursoux": { walk: "img/doursoux-street.jpg", read: "img/doursoux-inside.jpg", dossier: "img/doursoux-inside.jpg", pos: { walk: "8% center", read: "center 35%", dossier: "center 30%" } },
  "pluie": { rain: "img/panoramas.jpg", pos: { rain: "center 40%" } },
  "oeil": { lens: "img/lens-menu.jpg", pos: { lens: "left center" } },
  "dehillerin": { walk: "img/dehillerin-street.jpg", read: "img/dehillerin-sign.jpg", dossier: "img/dehillerin-copper.jpg", pos: { dossier: "center 78%" },
    inside: [["img/dehillerin-counter.jpg", "The counter, with portraits of the Dehillerin family"], ["img/dehillerin-moulds.jpg", "Shelves of baking moulds, priced by hand"], ["img/dehillerin-copper.jpg", "Copper pans, tin-lined"]] }
};
const params = new URLSearchParams(location.search);
let seen = false;
try { seen = localStorage.getItem("dd-onboarded") === "1"; } catch (e) {}
const S = { screen: (seen && params.get("intro") !== "1") ? "courant" : "intro1", spot: 0, held: {}, paradigm: params.get("mode") === "derive" ? "derive" : "drift" };
S.rain = params.get("rain") === "1";
const finishIntro = () => { try { localStorage.setItem("dd-onboarded", "1"); } catch (e) {} };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const bi = (en, fr, size, frSize) => `<span style="font-size:${size}px">${esc(en)}</span> <span class="fr" style="font-size:${frSize}px">${esc(fr)}</span>`;
const scene = (id, filter, label, view) => { const src = view && IMG[id] && IMG[id][view]; return `<div class="fill" role="img" aria-label="${esc(label)}" style="background:${src ? `url('${src}') ${(IMG[id].pos && IMG[id].pos[view]) || "center"}/cover no-repeat, ` : ""}${SCENES[id]};filter:${filter}"></div>`; };

const WALK = {
  "dehillerin": { bearing: 45, distM: 110, dirEn: "Head north-east along Rue Coquillière", dirFr: "Rue Coquillière, vers le nord-est", history: "Founded in 1820 and still supplying professional kitchens. Shelves run floor to ceiling, and staff fetch pieces down by hand." },
  "chez-denise": { bearing: 300, distM: 180, dirEn: "Walk west past Saint-Eustache", dirFr: "Vers l’ouest, après Saint-Eustache", history: "A holdover from the old Les Halles market, when porters and butchers ate here through the night. It still keeps market-hours." },
  "doursoux": { bearing: 205, distM: 340, dirEn: "Follow Boulevard de Vaugirard south-west", dirFr: "Boulevard de Vaugirard, vers le sud-ouest", history: "A long-running army-surplus shop. Stock changes as old uniform issues come in, so what’s on the rails is never the same twice." },
  "baron-rouge": { bearing: 120, distM: 60, dirEn: "Cut east toward the Marché d’Aligre", dirFr: "Vers l’est, direction marché d’Aligre", history: "A neighbourhood wine bar beside the Aligre market. On market mornings, oysters are opened on the pavement outside." }
};
S.remaining = WALK[SPOTS[S.spot].id].distM;

function topBar(sp, derive) {
  const ink = derive ? "#111" : "#e5e5e5";
  const chip = derive ? "rgba(0,0,0,.07)" : "rgba(255,255,255,.08)";
  return `<div class="abs" style="top:36px;left:20px;right:20px;z-index:30;display:flex;justify-content:space-between;align-items:center;color:${ink}">
    <div style="display:flex;align-items:center;gap:8px;white-space:nowrap"><button data-mode="1" aria-label="Switch to ${derive ? "Drift, the walking view" : "Dérive, the reading view"}" style="font-size:24px;letter-spacing:1.1px;text-transform:uppercase;padding:6px 8px 2px;margin-left:-8px;border-radius:6px;background:${chip}">${derive ? "dérive" : "drift"} ⇄</button><span style="font-size:24px">${derive ? "Read" : "Walk"} <span class="fr" style="font-size:18px">${derive ? "Lire" : "Marcher"}</span></span></div>
    <div style="display:flex;align-items:center;gap:6px;white-space:nowrap">
      <button data-act="weather" aria-label="Weather: ${S.rain ? "raining" : "sunny"}. Tap to switch for the demo." style="font-size:24px;background:${derive ? "transparent" : (S.rain ? "rgba(12,42,58,.85)" : "rgba(0,0,0,.6)")};padding:4px 8px 2px;border-radius:4px;border:1px solid ${derive ? "rgba(0,0,0,.25)" : (S.rain ? "#0ea5e9" : "rgba(255,255,255,.2)")};color:${derive ? "#111" : (S.rain ? "#7dd3fc" : "#e5e5e5")}">${S.rain ? "☂ 8°C · Rain" : "☀ 11°C"}</button>
      <button data-go="intro1" aria-label="How it works" style="width:30px;height:30px;border-radius:999px;border:1px solid ${derive ? "rgba(0,0,0,.3)" : "rgba(255,255,255,.35)"};background:${derive ? "transparent" : "rgba(0,0,0,.6)"};display:flex;align-items:center;justify-content:center;font-size:24px;padding-top:4px">?</button>
    </div>
  </div>`;
}

function dots(dark) {
  return `<div style="display:flex;justify-content:center;align-items:center;gap:2px">
    ${SPOTS.map((s, i) => `<button data-spot="${i}" aria-label="${esc(s.name)}" style="height:28px;padding:0 5px;display:flex;align-items:center"><span style="display:block;height:6px;border-radius:999px;width:${i === S.spot ? 24 : 6}px;background:${i === S.spot ? (dark ? "#111" : "#fff") : (dark ? "rgba(0,0,0,.25)" : "rgba(255,255,255,.4)")};transition:width .2s"></span></button>`).join("")}
  </div>`;
}

function courant(sp, derive) { return derive ? reading(sp) : walking(sp); }

function walking(sp) {
  const w = WALK[sp.id], here = S.remaining <= 0;
  return `<div class="fill">
  ${scene(sp.id, "contrast(1.05)", sp.name, "walk")}
  <div class="fill" style="background:linear-gradient(to top,#000 8%,rgba(0,0,0,.35) 45%,rgba(0,0,0,.7))"></div>
  ${topBar(sp, false)}
  ${S.rain ? `<button data-act="dry" style="position:absolute;top:84px;left:16px;right:16px;z-index:25;display:flex;justify-content:space-between;align-items:center;gap:8px;background:rgba(12,42,58,.92);border:1px solid #0ea5e9;border-radius:14px;padding:10px 14px 6px">
    <span style="display:flex;flex-direction:column;gap:2px;text-align:left"><span style="font-size:26px;color:#fff">☂ Rain starting · take the covered route</span><span class="fr" style="font-size:18px;color:#7dd3fc">Il commence à pleuvoir</span></span>
    <span style="font-size:28px;color:#7dd3fc">→</span></button>` : ""}
  <div class="abs" style="top:${S.rain ? 168 : 118}px;left:20px;right:20px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center">
    ${here
      ? `<div style="width:120px;height:120px;border-radius:999px;background:#fbbf24;color:#000;display:flex;align-items:center;justify-content:center;font-size:80px;padding-top:10px;box-sizing:border-box">✓</div>
         <div style="font-size:72px;line-height:52px;color:#fff">You’re here</div>
         <div style="font-size:27px;color:#d4d4d4">Vous y êtes. Open the dossier to see what to look for.</div>`
      : `<svg class="arrow" width="120" height="120" viewBox="0 0 120 120" aria-hidden="true" style="transform:rotate(${w.bearing}deg)"><path d="M60 6 L102 106 L60 82 L18 106 Z" fill="#fbbf24"/></svg>
         <div style="font-size:96px;line-height:64px;color:#fff;text-shadow:0 2px 16px rgba(0,0,0,.6)"><span id="dist">${Math.ceil(S.remaining)}</span><span style="font-size:48px">m</span></div>
         <div style="display:flex;flex-direction:column;gap:4px;text-shadow:0 1px 10px rgba(0,0,0,.8)"><span style="font-size:29px;line-height:21px;color:#fff">${esc(w.dirEn)}</span><span class="fr" style="font-size:20px;color:#fff">${esc(w.dirFr)}</span></div>
         <button data-go="poche" style="margin-top:6px;border:1px solid rgba(255,255,255,.4);background:rgba(0,0,0,.55);border-radius:999px;padding:10px 18px 6px;color:#fff"><span style="font-size:24px">PUT PHONE AWAY</span> <span class="fr" style="font-size:18px">Ranger le téléphone</span></button>`}
  </div>
  <div class="abs" style="bottom:132px;left:16px;right:16px;z-index:20;display:flex;flex-direction:column;gap:4px">
    <button data-go="dossier" aria-label="Open dossier for ${esc(sp.name)}" style="display:flex;justify-content:space-between;align-items:center;gap:10px;background:rgba(10,10,10,.88);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:14px 16px">
      <div style="display:flex;flex-direction:column;gap:4px;min-width:0"><span style="font-size:20px;color:#fbbf24;text-transform:uppercase">${esc(sp.tagEn)}</span><span style="font-size:36px;line-height:26px;color:#fff">${esc(sp.name)}</span></div>
      <span style="font-size:24px;color:#fff;white-space:nowrap">DOSSIER →</span>
    </button>
    ${dots(false)}
  </div>
  ${S.toast ? `<div class="abs" role="status" style="top:${S.rain ? 146 : 84}px;left:20px;right:20px;z-index:35;display:flex;justify-content:center"><span style="background:#fbbf24;color:#000;border-radius:999px;padding:8px 14px 4px;font-size:24px">${esc(S.toast)}</span></div>` : ""}
  ${S.sheet ? `<div class="fill" style="z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:flex-end">
    <div role="dialog" aria-label="Reroute" style="width:100%;background:#171717;border-top:1px solid #333;border-radius:24px 24px 0 0;padding:20px 16px 24px;display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-size:32px;color:#fff">Reroute <span class="fr" style="font-size:22px">Bifurquer</span></span><button data-act="close" style="font-size:24px;color:#a3a3a3;padding:8px 0 4px">CANCEL</button></div>
${S.rain ? `      <button data-act="dry" style="display:flex;flex-direction:column;gap:4px;background:#0c2a3a;border:1px solid #0ea5e9;border-radius:16px;padding:14px 16px 10px;text-align:left">
        <span style="font-size:30px;color:#fff">☂ Stay dry <span class="fr" style="font-size:20px">À l’abri</span></span>
        <span style="font-size:24px;color:#7dd3fc">It’s raining. Take the covered route through the arcades.</span>
      </button>
` : ""}
      <button data-act="other" style="display:flex;flex-direction:column;gap:4px;background:#262626;border-radius:16px;padding:14px 16px 10px;text-align:left">
        <span style="font-size:30px;color:#fff">⤳ Somewhere else <span class="fr" style="font-size:20px">Ailleurs</span></span>
        <span style="font-size:24px;color:#a3a3a3">Next place nearby: ${esc(SPOTS[(S.spot + 1) % SPOTS.length].name.split(" (")[0])} · ${esc(SPOTS[(S.spot + 1) % SPOTS.length].dist)}</span>
      </button>
    </div></div>` : ""}
  </div>`;
}

function reading(sp) {
  const w = WALK[sp.id], n = S.spot + 1;
  return `<div class="fill" style="background:#efece6;color:#111;overflow-y:auto">
  ${topBar(sp, true)}
  <div style="padding:88px 20px 32px;display:flex;flex-direction:column;gap:16px">
    <div style="display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #111;padding-bottom:6px">
      <span style="font-size:20px;letter-spacing:.1em">MONOGRAPH <span class="fr" style="font-size:15px">MONOGRAPHIE</span></span>
      <span style="font-size:20px">No. ${n} / ${SPOTS.length}</span>
    </div>
    <div style="position:relative;height:230px;border-radius:4px;overflow:hidden">
      ${scene(sp.id, "grayscale(1) contrast(1.2)", sp.name, "read")}
      <div class="abs" style="left:10px;bottom:10px;background:#fff;color:#000;font-size:22px;padding:4px 8px 2px;text-transform:uppercase">${esc(sp.arr)} · ${esc(sp.dist)}</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px">
      <span style="font-size:22px;color:#6b5200;text-transform:uppercase">${esc(sp.tagEn)} <span class="fr" style="font-size:17px">${esc(sp.tagFr)}</span></span>
      <h1 style="margin:0;font-size:52px;line-height:38px;font-weight:700;text-transform:uppercase;letter-spacing:-.02em">${esc(sp.name)}</h1>
    </div>
    <p style="margin:0;font-size:30px;line-height:22px">${esc(sp.specEn)}</p>
    <p class="serif" style="margin:0;font-size:13px;color:#4a4a4a">${esc(sp.specFr)}</p>
    ${IMG[sp.id] && IMG[sp.id].inside ? `<div style="display:flex;flex-direction:column;gap:8px">
      <span style="font-size:20px;letter-spacing:.1em;color:#4a4a4a">INSIDE <span class="fr" style="font-size:15px">À L’INTÉRIEUR</span></span>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px">${IMG[sp.id].inside.map(([src, alt]) => `<img src="${src}" alt="${esc(alt)}" loading="lazy" style="width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:3px;filter:grayscale(1) contrast(1.1)">`).join("")}</div>
    </div>` : ""}
    <div style="border-top:1px solid rgba(0,0,0,.2);padding-top:12px;display:flex;flex-direction:column;gap:6px">
      <span style="font-size:20px;letter-spacing:.1em;color:#4a4a4a">HISTORY <span class="fr" style="font-size:15px">HISTOIRE</span></span>
      <p style="margin:0;font-size:27px;line-height:20px">${esc(w.history)}</p>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;border-top:1px solid rgba(0,0,0,.2);padding-top:12px">
      <div style="display:flex;flex-direction:column;gap:4px"><span style="font-size:18px;color:#4a4a4a">ADDRESS</span><span style="font-size:24px">${esc(sp.address)}</span></div>
      <div style="display:flex;flex-direction:column;gap:4px"><span style="font-size:18px;color:#4a4a4a">HOURS</span><span style="font-size:24px">${esc(sp.hoursEn)}</span></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px;margin-top:6px">
      <button data-mode="1" style="min-height:52px;border-radius:999px;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;gap:8px"><span style="font-size:30px;padding-top:4px">WALK THERE · ${esc(sp.dist)}</span></button>
      <button data-spot="${(S.spot + 1) % SPOTS.length}" style="min-height:48px;border-radius:999px;border:1.5px solid #111;display:flex;align-items:center;justify-content:center"><span style="font-size:26px;padding-top:4px">NEXT PLACE · ${esc(SPOTS[(S.spot + 1) % SPOTS.length].name.split(" (")[0])}</span></button>
    </div>
    ${dots(true)}
  </div></div>`;

  const sp = SPOTS[S.spot], derive = S.paradigm === "derive";
  const body = { courant: () => courant(sp, derive), pluie: () => pluie(derive), dossier: () => dossier(sp, derive), cahier, oeil, poche, intro1, intro2 }[S.screen]();
  phone.innerHTML = body + (["poche", "intro1", "intro2"].includes(S.screen) || (S.screen === "courant" && derive) ? "" : chrome());
}
phone.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.finish) finishIntro();
  if (b.dataset.act) {
    const a = b.dataset.act;
    S.sheet = a === "sheet";
    if (a === "other") {
      S.spot = (S.spot + 1) % SPOTS.length; S.remaining = WALK[SPOTS[S.spot].id].distM;
      S.toast = "New direction · " + SPOTS[S.spot].name.split(" (")[0];
      clearTimeout(S.toastTimer); S.toastTimer = setTimeout(() => { S.toast = ""; if (S.screen === "courant") render(); }, 2600);
    }
    if (a === "dry") S.screen = "pluie";
    if (a === "weather") { S.rain = !S.rain; S.toast = S.rain ? "Demo: it’s raining" : "Demo: sunny again"; clearTimeout(S.toastTimer); S.toastTimer = setTimeout(() => { S.toast = ""; if (S.screen === "courant") render(); }, 2000); }
    render(); return;
  }
  if (b.dataset.mode) S.paradigm = S.paradigm === "drift" ? "derive" : "drift";
  else if (b.dataset.go) { S.screen = b.dataset.go; S.sheet = false; }
  else if (b.dataset.spot) { S.spot = +b.dataset.spot; S.remaining = WALK[SPOTS[S.spot].id].distM; }
  else if (b.dataset.hold) S.held[b.dataset.hold] = !S.held[b.dataset.hold];
  render();
  const again = b.dataset.go ? phone.querySelector(`[data-go="${b.dataset.go}"][aria-current]`) : null;
  if (again) again.focus();
});
document.addEventListener("keydown", e => { if (e.key === "d" || e.key === "D") { S.paradigm = S.paradigm === "drift" ? "derive" : "drift"; render(); } });
function fit() {
  const s = Math.min(1, (innerHeight - 32) / 844, (innerWidth - (innerWidth <= 430 ? 0 : 32)) / 390);
  const small = innerWidth <= 430;
  const scale = small ? Math.min(innerWidth / 390, innerHeight / 844) : s;
  document.getElementById("stage").style.transform = `scale(${scale})`;
}
addEventListener("resize", fit);
setInterval(() => {
  const walking = S.screen === "courant" && S.paradigm === "drift";
  if ((!walking && S.screen !== "poche") || S.remaining <= 0) return;
  const total = WALK[SPOTS[S.spot].id].distM, before = S.remaining;
  S.remaining = Math.max(0, S.remaining - 3);
  // a "turn" halfway, and arrival: pulse the lock-screen card and vibrate where supported
  const crossedTurn = before > total / 2 && S.remaining <= total / 2;
  if (S.screen === "poche" && (crossedTurn || S.remaining <= 0)) {
    try { navigator.vibrate && navigator.vibrate(S.remaining <= 0 ? [120, 80, 120, 80, 240] : [80, 60, 80]); } catch (e) {}
    S.pulse = true; render(); setTimeout(() => { S.pulse = false; const c = document.getElementById("live"); if (c) c.classList.remove("pulse"); }, 1600);
    return;
  }
  const el = document.getElementById(walking ? "dist" : "pdist");
  if (S.remaining <= 0 || !el) render(); else el.textContent = Math.ceil(S.remaining);
}, 1000);
fit(); render();
</script>
</body>
