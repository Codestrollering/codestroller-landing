<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dérive & Drift — Interactive Prototype</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & Babel CDNs (pinned versions) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
  <style>
    body {
      background-color: #0a0a0a;
      color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const SPOTS = [
      {
        id: 'dehillerin',
        name: 'E. Dehillerin',
        tagFr: 'Cuivre & Outillage',
        tagEn: 'Heavy Copper & Cutlery',
        arr: '1er Arrondissement',
        address: '18 Rue Coquillière',
        dist: '110m',
        hours: '09:00 – 19:00 · Ouvert / Open',
        specFr: 'Cuivre massif 2.5mm–3mm étamé au feu. Queue de fonte rivetée. Aucun prix affiché : relevé au crayon et consultation du grand registre papier.',
        specEn: 'Solid 2.5–3mm hand-wiped tin copper. Riveted cast-iron handles. No price tags: cross-reference hand-punched codes in the central ledger.',
        category: 'cookware',
        image: 'https://images.unsplash.com/photo-1556911220-e15b29be8c8f?q=80&w=1200&auto=format&fit=crop',
        details: '2.5mm Cuivre Massif · Réf. 44102 · Détaxe sur place'
      },
      {
        id: 'chez-denise',
        name: 'Chez Denise (La Tour de Montlhéry)',
        tagFr: 'Bistrot de Nuit & Halles',
        tagEn: 'Historic All-Night Meat Counter',
        arr: '1er Arrondissement',
        address: '5 Rue des Prouvaires',
        dist: '180m',
        hours: 'Ouvert jusqu\'à 05:00 / Open until 5:00 AM',
        specFr: 'Nappes à carreaux rouges, serveurs en longs tabliers, os à moelle brûlants, tripes au bouillon et Brouilly tiré au pot.',
        specEn: 'Red checkered cloth, floor-length white aprons, roasted marrow bones, Caen-style tripe, and Beaujolais by the earthenware jug.',
        category: 'food',
        image: 'https://images.unsplash.com/photo-1550966871-3ed3cdb5ed0c?q=80&w=1200&auto=format&fit=crop',
        details: '4 Couverts libres au comptoir / 4 Open counter seats'
      },
      {
        id: 'doursoux',
        name: 'Doursoux Surplus Militaire',
        tagFr: 'Toile & Bleu de Travail',
        tagEn: 'Authentic French Workwear Surplus',
        arr: '15e Arrondissement',
        address: '3 Passage Alexandre',
        dist: '340m',
        hours: '10:00 – 18:30 · Mar–Sam / Tue–Sat',
        specFr: 'Rayons d\'acier brut sans mise en scène. Véritables vestes en moleskine et sergé de coton bleu 1950–1970 à prix d\'atelier (30 €–65 €).',
        specEn: 'Raw steel shelves without boutique markups. Authentic French moleskin and indigo cotton chore coats (30 €–65 €).',
        category: 'workwear',
        image: 'https://images.unsplash.com/photo-1489987707025-afc232f7ea0f?q=80&w=1200&auto=format&fit=crop',
        details: '30 € – 65 € · Stocks militaires d\'époque'
      },
      {
        id: 'baron-rouge',
        name: 'Le Baron Rouge',
        tagFr: 'Zinc & Huîtres au Tonneau',
        tagEn: 'Curb Wine Cask & Fresh Oysters',
        arr: '12e Arrondissement',
        address: '1 Rue Théophile Roussel',
        dist: '60m',
        hours: 'Comptoir Libre / Open Counter',
        specFr: 'Bourriche d\'huîtres ouvertes sur le trottoir le matin. Vin tiré directement de la cuve dans des bouteilles consignées.',
        specEn: 'Breton oysters shucked onto curb crates. Natural wine gravity-poured from oak barrels into refillable carafes.',
        category: 'food',
        image: 'https://images.unsplash.com/photo-1534422298391-e4f8c172dddb?q=80&w=1200&auto=format&fit=crop',
        details: 'Sans réservation · Dégustation sur tonneau'
      }
    ];

    const EVENTS_NOV = [
      {
        id: 'bach-cellos',
        time: '20:30 · 21 NOVEMBRE',
        titleFr: 'Suites pour Violoncelle Seul (J.S. Bach)',
        titleEn: 'Unaccompanied Cello Suites by Candlelight',
        venue: 'Église Saint-Éphrem (Ve Arr.)',
        descFr: 'Nef acoustique en pierre du XVIIe siècle. Éclairage exclusif à la bougie. 45 chaises de bois.',
        descEn: '17th-century vaulted stone chapel. Solely candlelit. 45 wooden seats, pure natural acoustics.',
        actionFr: 'Retenir 4 places',
        actionEn: 'Hold 4 seats'
      },
      {
        id: 'vernissage-estampes',
        time: '18:00 · 23 NOVEMBRE',
        titleFr: 'Vernissage : Typographie & Épreuves d\'Artiste',
        titleEn: 'Vernissage: Typography & Silver Proofs',
        venue: 'Galerie d\'Estampes (Rue Charlot, IIIe)',
        descFr: 'Portes de la cour cochère grandes ouvertes. Tirages argentiques noir et blanc, vin servi au gobelet Duralex.',
        descEn: 'Carriage courtyard wide open. Silver gelatin prints on cotton rag, natural wine in Duralex glasses.',
        actionFr: 'Ajouter au courant',
        actionEn: 'Add to drift'
      }
    ];

    function App() {
      const [paradigm, setParadigm] = useState('drift');
      const [activeScreen, setActiveScreen] = useState('courant');
      const [selectedSpot, setSelectedSpot] = useState(SPOTS[0]);
      const [isRaining, setIsRaining] = useState(false);
      const [chromeVisible, setChromeVisible] = useState(true);
      const [secondsRemaining, setSecondsRemaining] = useState(4);
      const [timerLocked, setTimerLocked] = useState(false);
      const timerRef = useRef(null);

      const resetTimer = () => {
        setChromeVisible(true);
        setSecondsRemaining(4);
        if (timerRef.current) clearInterval(timerRef.current);
        if (timerLocked) return;

        timerRef.current = setInterval(() => {
          setSecondsRemaining((prev) => {
            if (prev <= 1) {
              clearInterval(timerRef.current);
              setChromeVisible(false);
              return 0;
            }
            return prev - 1;
          });
        }, 1000);
      };

      useEffect(() => {
        resetTimer();
        return () => clearInterval(timerRef.current);
      }, [activeScreen, paradigm, isRaining, timerLocked]);

      const handleScreenTap = () => {
        resetTimer();
      };

      return (
        <div className="w-full min-h-screen bg-neutral-950 flex flex-col items-center justify-start p-3 sm:p-8">

          {/* Portfolio & Case Study Inspector Header */}
          <div className="w-full max-w-[420px] bg-neutral-900 border border-neutral-800 rounded-2xl p-3.5 mb-5 shadow-2xl flex flex-col gap-2.5">
            <div className="flex items-center justify-between border-b border-neutral-800 pb-2">
              <div className="flex items-center gap-2">
                <span className="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                <span className="text-xs font-mono font-bold tracking-wider uppercase text-neutral-300">Dérive Prototype</span>
              </div>
              <button
                onClick={() => setTimerLocked(!timerLocked)}
                className={`text-[10px] font-mono px-2 py-0.5 rounded border transition ${
                  timerLocked
                    ? 'bg-amber-500/20 border-amber-500 text-amber-300 font-bold'
                    : 'bg-neutral-800 border-neutral-700 text-neutral-400'
                }`}
              >
                {timerLocked ? 'NAV LOCKED OPEN' : `AUTO-DECAY: ${secondsRemaining}s`}
              </button>
            </div>

            <div className="grid grid-cols-2 gap-2">
              <button
                onClick={() => setParadigm('drift')}
                className={`py-2 px-3 rounded-xl text-xs font-bold transition flex flex-col items-center border ${
                  paradigm === 'drift'
                    ? 'bg-white text-black border-white shadow-md'
                    : 'bg-neutral-800 text-neutral-400 border-neutral-700 hover:text-white'
                }`}
              >
                <span>DRIFT</span>
                <span className="text-[9px] font-mono opacity-60">Optical HUD</span>
              </button>
              <button
                onClick={() => setParadigm('derive')}
                className={`py-2 px-3 rounded-xl text-xs font-bold transition flex flex-col items-center border ${
                  paradigm === 'derive'
                    ? 'bg-white text-black border-white shadow-md'
                    : 'bg-neutral-800 text-neutral-400 border-neutral-700 hover:text-white'
                }`}
              >
                <span>DÉRIVE</span>
                <span className="text-[9px] font-mono opacity-60">Monograph</span>
              </button>
            </div>

            <div className="flex items-center justify-between pt-1 text-xs">
              <button
                onClick={() => {
                  setIsRaining(!isRaining);
                  if (!isRaining) setActiveScreen('pluie');
                }}
                className={`px-3 py-1 rounded-lg text-[11px] font-mono transition border ${
                  isRaining
                    ? 'bg-sky-950 border-sky-400 text-sky-200'
                    : 'bg-neutral-800 border-neutral-700 text-neutral-300'
                }`}
              >
                {isRaining ? '🌧 Météo: Pluie / Rain' : '⛅ Météo: Sec / Dry'}
              </button>
              <span className="text-[11px] font-mono text-neutral-500">
                Tap phone to wake nav
              </span>
            </div>
          </div>

          {/* iPhone Frame Shell */}
          <div
            onClick={handleScreenTap}
            className="relative w-full max-w-[400px] h-[812px] rounded-[48px] overflow-hidden border-[8px] border-neutral-800 shadow-[0_25px_60px_-15px_rgba(0,0,0,0.9)] bg-black select-none"
          >
            {/* Dynamic Island / Speaker Notch */}
            <div className="absolute top-0 inset-x-0 h-7 flex items-center justify-center z-50 pointer-events-none">
              <div className="w-32 h-4 bg-neutral-900 rounded-b-xl border-b border-neutral-800 flex items-center justify-center">
                <div className="w-8 h-1 bg-neutral-700 rounded-full"></div>
              </div>
            </div>

            {/* Core Screen Router */}
            <div className="w-full h-full relative">
              {activeScreen === 'courant' && (
                <ScreenCourant paradigm={paradigm} spot={selectedSpot} onSelectSpot={setSelectedSpot} onGoDossier={() => setActiveScreen('dossier')} />
              )}
              {activeScreen === 'pluie' && (
                <ScreenPluie paradigm={paradigm} onDismiss={() => setActiveScreen('courant')} />
              )}
              {activeScreen === 'dossier' && (
                <ScreenDossier paradigm={paradigm} spot={selectedSpot} onBack={() => setActiveScreen('courant')} />
              )}
              {activeScreen === 'cahier' && (
                <ScreenCahier paradigm={paradigm} events={EVENTS_NOV} />
              )}
              {activeScreen === 'oeil' && (
                <ScreenOeil paradigm={paradigm} />
              )}
              {activeScreen === 'poche' && (
                <ScreenPoche paradigm={paradigm} isRaining={isRaining} onWake={() => setActiveScreen('courant')} />
              )}
            </div>

            {/* Floating Action Buttons (Auto-Hides) */}
            {activeScreen !== 'poche' && (
              <div
                className={`absolute bottom-24 inset-x-4 z-40 flex items-center justify-between gap-2.5 transition-all duration-300 ${
                  chromeVisible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-4 pointer-events-none'
                }`}
              >
                <button
                  onClick={(e) => {
                    e.stopPropagation();
                    setActiveScreen(activeScreen === 'pluie' ? 'courant' : 'pluie');
                    resetTimer();
                  }}
                  className="flex-1 py-2.5 px-2 rounded-full text-[11px] font-bold tracking-tight bg-white text-black border border-white hover:bg-neutral-200 transition shadow-lg flex items-center justify-center gap-1.5"
                >
                  <span>⤳</span>
                  <span>BIFURQUER / REROUTE</span>
                </button>

                <button
                  onClick={(e) => {
                    e.stopPropagation();
                    setActiveScreen('oeil');
                    resetTimer();
                  }}
                  className="flex-1 py-2.5 px-2 rounded-full text-[11px] font-bold tracking-tight bg-neutral-900/90 text-white border border-neutral-700 backdrop-blur-md hover:bg-neutral-800 transition shadow-lg flex items-center justify-center gap-1.5"
                >
                  <span>⌕</span>
                  <span>L'ŒIL FAÇADE / LENS</span>
                </button>
              </div>
            )}

            {/* Bottom Navigation Dock (Auto-Hides) */}
            {activeScreen !== 'poche' && (
              <nav
                className={`absolute bottom-4 inset-x-3 z-40 transition-all duration-300 ${
                  chromeVisible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-6 pointer-events-none'
                }`}
              >
                <div className="bg-neutral-950/90 backdrop-blur-xl border border-white/15 rounded-3xl p-1 shadow-2xl flex items-center justify-between text-neutral-300">
                  <NavTab
                    active={activeScreen === 'courant'}
                    onClick={() => { setActiveScreen('courant'); resetTimer(); }}
                    labelFr="COURANT" labelEn="DRIFT"
                  />
                  <NavTab
                    active={activeScreen === 'pluie'}
                    onClick={() => { setActiveScreen('pluie'); resetTimer(); }}
                    labelFr="PLUIE" labelEn="RAIN"
                  />
                  <NavTab
                    active={activeScreen === 'oeil'}
                    onClick={() => { setActiveScreen('oeil'); resetTimer(); }}
                    labelFr="L'ŒIL" labelEn="LENS"
                    isCenter
                  />
                  <NavTab
                    active={activeScreen === 'cahier'}
                    onClick={() => { setActiveScreen('cahier'); resetTimer(); }}
                    labelFr="CAHIER" labelEn="REGISTER"
                  />
                  <NavTab
                    active={activeScreen === 'poche'}
                    onClick={() => { setActiveScreen('poche'); resetTimer(); }}
                    labelFr="POCHE" labelEn="POCKET"
                  />
                </div>
              </nav>
            )}

          </div>
        </div>
      );
    }

    function ScreenCourant({ paradigm, spot, onSelectSpot, onGoDossier }) {
      return (
        <div className="relative w-full h-full">
          <img
            src={spot.image}
            alt={spot.name}
            className={`w-full h-full object-cover ${paradigm === 'derive' ? 'grayscale contrast-125' : 'contrast-105'}`}
          />
          <div className="absolute inset-0 bg-gradient-to-t from-black via-black/30 to-black/60" />

          {/* Top Status */}
          <div className="absolute top-9 inset-x-5 flex justify-between items-start z-10 font-mono text-[11px] text-neutral-200">
            <div>
              <span className="font-bold tracking-widest uppercase">{paradigm}</span>
              <span className="mx-1.5 opacity-40">·</span>
              <span>{spot.arr}</span>
            </div>
            <div className="bg-black/60 backdrop-blur-md px-2 py-0.5 rounded border border-white/20">
              15:10 · 8°C
            </div>
          </div>

          {/* Reticle / Vignette */}
          {paradigm === 'drift' ? (
            <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
              <div className="relative w-44 h-44 border border-white/40 rounded-2xl flex items-center justify-center">
                <div className="w-2.5 h-2.5 bg-amber-400 rounded-full animate-ping"></div>
                <div className="absolute -top-3 left-3 bg-black px-1.5 py-0.5 text-[9px] font-mono text-amber-300 border border-white/20">
                  VECTOR ACTIVE
                </div>
              </div>
            </div>
          ) : (
            <div className="absolute top-20 left-5 right-5 space-y-1 pointer-events-none">
              <div className="inline-block bg-white text-black font-mono text-[10px] font-bold uppercase px-2 py-0.5">
                {spot.arr} · {spot.dist}
              </div>
              <br/>
              <h1 className="inline-block bg-white text-black font-black text-2xl tracking-tight px-2.5 py-1 uppercase leading-none">
                {spot.name}
              </h1>
            </div>
          )}

          {/* Bottom Card */}
          <div className="absolute bottom-36 inset-x-4 z-20">
            <div
              onClick={onGoDossier}
              className="cursor-pointer bg-neutral-950/85 backdrop-blur-xl border border-white/20 rounded-2xl p-4 shadow-2xl hover:border-white/40 transition"
            >
              <div className="flex justify-between items-start mb-1">
                <div>
                  <span className="text-[10px] font-mono uppercase tracking-wider text-amber-400 font-bold">
                    {spot.tagFr} / {spot.tagEn}
                  </span>
                  <h2 className="text-base font-bold text-white tracking-tight">{spot.name}</h2>
                </div>
                <span className="text-xs font-mono bg-white/10 px-2 py-0.5 rounded text-neutral-300">{spot.dist}</span>
              </div>
              <p className="text-xs text-neutral-300 font-serif leading-relaxed line-clamp-2 mb-2">
                {spot.specFr}
              </p>
              <div className="flex items-center justify-between text-[11px] font-mono pt-2 border-t border-white/10 text-neutral-400">
                <span>{spot.hours}</span>
                <span className="text-white font-bold">DOSSIER →</span>
              </div>
            </div>

            {/* Dots */}
            <div className="flex justify-center items-center gap-2 mt-3">
              {SPOTS.map((s) => (
                <button
                  key={s.id}
                  aria-label={s.name}
                  onClick={(e) => {
                    e.stopPropagation();
                    onSelectSpot(s);
                  }}
                  className={`h-1.5 rounded-full transition-all ${
                    s.id === spot.id ? 'w-6 bg-white' : 'w-1.5 bg-white/40'
                  }`}
                />
              ))}
            </div>
          </div>
        </div>
      );
    }

    function ScreenPluie({ paradigm, onDismiss }) {
      return (
        <div className="relative w-full h-full bg-neutral-950">
          <img
            src="https://images.unsplash.com/photo-1502602898657-3e91760cbb34?q=80&w=1200&auto=format&fit=crop"
            alt="Passage des Panoramas"
            className={`w-full h-full object-cover ${paradigm === 'derive' ? 'grayscale contrast-150' : 'brightness-90'}`}
          />
          <div className="absolute inset-0 bg-gradient-to-t from-black via-black/40 to-black/80" />

          <div className="absolute top-9 inset-x-5 flex justify-between items-center z-10 font-mono text-xs text-neutral-200">
            <span className="text-sky-400 font-bold">🌧 BIFURCATION · AVERSE / RAIN</span>
            <button onClick={onDismiss} className="underline text-neutral-400">FERMER / CLOSE</button>
          </div>

          <div className="absolute top-20 inset-x-5 space-y-1.5 pointer-events-none">
            <div className="inline-block bg-sky-500 text-black font-mono text-[10px] font-bold uppercase px-2 py-0.5">
              COUVERTURE IMMÉDIATE / SHELTER
            </div>
            <h2 className="text-2xl font-black uppercase text-white tracking-tight">Passage des Panoramas</h2>
            <p className="text-xs text-neutral-300 font-serif">Verrière de 1799. Sol sec, librairies philatéliques et comptoirs chauffés.</p>
          </div>

          <div className="absolute bottom-36 inset-x-4 space-y-2 z-20">
            <div className="bg-black/90 backdrop-blur-md border border-white/20 rounded-2xl p-4 text-xs space-y-2.5">
              <div className="text-[10px] font-mono text-neutral-400 uppercase tracking-widest font-bold">
                ITINÉRAIRE À SEC / DRY DRIFT LEGS (80M)
              </div>
              <div className="text-neutral-200">
                <div className="font-bold">1. Entrée Rue Vivienne (Abri immédiat)</div>
                <div className="text-[11px] text-neutral-400">Dry entrance 80m ahead</div>
              </div>
              <div className="text-neutral-200">
                <div className="font-bold">2. Liaison vers Jouffroy & Verdeau</div>
                <div className="text-[11px] text-neutral-400">Continuous sheltered crossing toward 9e Arr.</div>
              </div>
              <button
                onClick={onDismiss}
                className="w-full mt-2 py-2 bg-sky-500 text-black font-bold font-mono text-xs rounded-xl uppercase"
              >
                ENGAGER LA LIGNE / ENGAGE ROUTE
              </button>
            </div>
          </div>
        </div>
      );
    }

    function ScreenDossier({ paradigm, spot, onBack }) {
      return (
        <div className="relative w-full h-full bg-neutral-950 overflow-y-auto pb-32">
          <div className="relative h-64 w-full">
            <img src={spot.image} alt={spot.name} className={`w-full h-full object-cover ${paradigm === 'derive' ? 'grayscale' : ''}`} />
            <div className="absolute inset-0 bg-gradient-to-t from-neutral-950 via-neutral-950/20 to-black/70" />
            <button
              onClick={onBack}
              className="absolute top-9 left-5 font-mono text-xs bg-black/60 backdrop-blur-md border border-white/20 px-3 py-1 rounded-full text-white"
            >
              ← RETOUR / BACK
            </button>
            <div className="absolute bottom-3 left-5 right-5">
              <span className="text-[10px] font-mono uppercase text-amber-400 font-bold">{spot.tagFr} · {spot.tagEn}</span>
              <h1 className="text-2xl font-black uppercase text-white tracking-tight">{spot.name}</h1>
            </div>
          </div>

          <div className="p-4 space-y-3 text-xs">
            <div className="bg-neutral-900 border border-neutral-800 p-3 rounded-xl font-mono">
              <div className="text-neutral-500 text-[10px]">LOCALISATION & ACCÈS</div>
              <div className="font-bold text-white mt-0.5">{spot.address} ({spot.arr})</div>
              <div className="text-[11px] text-emerald-400 mt-1">{spot.hours}</div>
            </div>

            <div className="bg-neutral-900/60 border border-neutral-800 rounded-xl p-4 space-y-2">
              <div className="text-[10px] font-mono text-neutral-400 uppercase font-bold">DOSSIER MATIÈRE / CRAFT SPEC</div>
              <p className="text-neutral-200 font-serif leading-relaxed">{spot.specFr}</p>
              <p className="text-neutral-400 font-sans text-[11px] pt-2 border-t border-neutral-800">{spot.specEn}</p>
            </div>

            <div className="bg-black border border-white/10 rounded-xl p-3 flex justify-between items-center font-mono">
              <div>
                <div className="text-[10px] text-neutral-500">INDICATION</div>
                <div className="font-bold text-white text-[11px]">{spot.details}</div>
              </div>
              <button onClick={onBack} className="px-3 py-1.5 bg-white text-black font-bold rounded-lg text-[10px]">
                FERMER
              </button>
            </div>
          </div>
        </div>
      );
    }

    function ScreenCahier({ paradigm, events }) {
      return (
        <div className="relative w-full h-full bg-neutral-950 p-5 pt-10 overflow-y-auto pb-32">
          <div className="border-b border-white/20 pb-2 mb-4">
            <span className="text-[10px] font-mono uppercase tracking-widest text-neutral-400 font-bold">
              LE CAHIER / THE REGISTER
            </span>
            <h1 className="text-2xl font-black uppercase text-white tracking-tight">20–28 Novembre</h1>
          </div>

          <div className="space-y-4">
            {events.map((evt) => (
              <div key={evt.id} className="bg-neutral-900 border border-neutral-800 rounded-2xl p-4 space-y-2 text-xs">
                <div className="flex justify-between text-[10px] font-mono text-amber-400 font-bold">
                  <span>{evt.time}</span>
                  <span className="text-neutral-400">{evt.venue}</span>
                </div>
                <div>
                  <h2 className="text-sm font-bold text-white">{evt.titleFr}</h2>
                  <div className="text-neutral-400 text-[11px]">{evt.titleEn}</div>
                </div>
                <p className="font-serif text-neutral-300">"{evt.descFr}"</p>

          </div>
        </div>

              <div className="text-neutral-400 text-[11px]">4 places au comptoir libre</div>
            </div>
          </div>
        </div>
      );
    }

    function ScreenPoche({ paradigm, isRaining, onWake }) {
      return (
        <div onClick={onWake} className="relative w-full h-full bg-gradient-to-b from-neutral-900 to-black p-6 flex flex-col justify-between cursor-pointer">
          <div className="pt-12 text-center space-y-1">
            <div className="text-xs font-mono text-neutral-400 tracking-widest uppercase">Vendredi 21 Novembre</div>
            <div className="text-6xl font-light text-white tracking-tighter">16:45</div>
          </div>

          <div className="w-full bg-neutral-900/95 border border-neutral-700 rounded-3xl p-4 shadow-2xl backdrop-blur-2xl space-y-2.5">
            <div className="flex justify-between items-center text-[10px] font-mono text-neutral-400 border-b border-neutral-800 pb-1.5">
              <span className="font-bold text-white">LIVE ACTIVITY · VIe ARR.</span>
              <span>16:45 · 8°C</span>
            </div>
            <div className="flex items-start gap-3">
              <div className="w-9 h-9 rounded-2xl bg-neutral-800 flex items-center justify-center text-amber-400 font-bold font-mono">↰</div>

    function NavTab({ active, onClick, labelFr, labelEn, isCenter }) {
      return (
        <button
          onClick={(e) => {
            e.stopPropagation();
            onClick();
          }}
          className={`flex-1 py-1 flex flex-col items-center justify-center transition ${
            isCenter
              ? 'bg-white text-black rounded-2xl py-2 font-bold shadow-md'
              : active ? 'text-white font-bold' : 'text-neutral-400 hover:text-neutral-200'
          }`}
        >
          <span className="text-[9px] font-mono leading-none">{labelFr}</span>
          <span className="text-[7px] font-mono opacity-60 leading-none mt-0.5">{labelEn}</span>

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
